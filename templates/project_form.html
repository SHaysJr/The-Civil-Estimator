{% extends 'base.html' %}{% block content %}<h1>{{ 'Edit project' if project else 'New project' }}</h1><form method="post" class="card formgrid">
<label>Project name<input name="name" required value="{{ project.name if project else '' }}"></label><label>Customer<input name="customer" value="{{ project.customer if project else '' }}"></label><label>Address<input name="address_line" value="{{ project.address_line if project else '' }}"></label><label>City<input name="city" value="{{ project.city if project else '' }}"></label><label>State<input name="state" value="{{ project.state if project else '' }}"></label><label>ZIP<input name="zip_code" value="{{ project.zip_code if project else '' }}"></label><label>Estimator<input name="estimator" value="{{ project.estimator if project else '' }}"></label><label>Bid date<input type="date" name="bid_date" value="{{ project.bid_date if project else '' }}"></label><label>Due date<input type="date" name="date_due" value="{{ project.date_due if project else '' }}"></label><label>Status<select name="status">{% for s in ['active','submitted','won','lost'] %}<option {% if project and project.status==s %}selected{% endif %}>{{ s }}</option>{% endfor %}</select></label><label>Tax %<input type="number" step="0.01" name="tax_rate" value="{{ (project.tax_rate|pct) if project else '10.0' }}"></label><label>Overhead %<input type="number" step="0.01" name="overhead_rate" value="{{ (project.overhead_rate|pct) if project else '10.0' }}"></label><label>Profit %<input type="number" step="0.01" name="profit_rate" value="{{ (project.profit_rate|pct) if project else '20.0' }}"></label><label>Bedding jurisdiction<input name="bedding_jurisdiction" value="{{ project.bedding_jurisdiction if project else '' }}" placeholder="e.g. MDOT Baseline"></label><label class="wide">Description<textarea name="description">{{ project.description if project else '' }}</textarea></label><div class="wide actions"><button>Save</button>{% if project %}<a href="{{ url_for('project',project_id=project.id) }}">Cancel</a>{% endif %}</div></form>{% endblock %}
