<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'New Estimator V4' }}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"></head>
<body>
<div class="version-badge">New Estimator V4</div><header><div><a class="brand" href="{{ url_for('index') }}">New Estimator</a><span class="sub">local construction estimating</span></div><nav><a href="{{ url_for('index') }}">Projects</a><a href="{{ url_for('rates') }}">Rate Catalog</a><a href="{{ url_for('companions_catalog') }}">Companion Rules</a><a href="{{ url_for('bedding_catalog') }}">Bedding Rules</a><a class="button" href="{{ url_for('new_project') }}">New Project</a></nav></header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
