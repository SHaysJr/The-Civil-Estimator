<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title or 'Estimator V3.1' }}</title><link rel="stylesheet" href="{{ url_for('static',filename='css/app.css') }}"></head>
<body>
<div style="position:fixed;right:12px;bottom:12px;background:#111827;color:white;padding:7px 10px;border-radius:6px;font:12px Arial,sans-serif;z-index:9999;opacity:.9">New Estimator V3.1</div><header><div><a class="brand" href="{{ url_for('index') }}">Estimator V3.1</a><span class="sub">local construction estimating</span></div><nav><a href="{{ url_for('index') }}">Projects</a><a href="{{ url_for('rates') }}">Rate Catalog</a><a class="button" href="{{ url_for('new_project') }}">New Project</a></nav></header><main>{% with messages=get_flashed_messages(with_categories=true) %}{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}{% block content %}{% endblock %}</main></body></html>
